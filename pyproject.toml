[project]
name = "omnimemory-api"
version = "2.0.0"
description = "Enterprise-grade Headless Context & Memory API"
requires-python = ">=3.11"

dependencies = [
    # ── Web Framework ──────────────────────────────────────────────────────
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "gunicorn==23.0.0",
    "python-multipart==0.0.12",

    # ── Database ───────────────────────────────────────────────────────────
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.10",     # Para Alembic (sync)
    "alembic==1.14.0",
    "pgvector==0.3.5",

    # ── Redis ──────────────────────────────────────────────────────────────
    "redis==5.2.0",                 # Inclui redis.asyncio

    # ── Validação & Settings ───────────────────────────────────────────────
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.0.1",

    # ── Segurança ──────────────────────────────────────────────────────────
    "passlib[bcrypt]==1.7.4",
    "python-jose[cryptography]==3.3.0",
    "cryptography==43.0.3",         # Para Fernet (AES-256)
    "bcrypt==4.2.1",

    # ── HTTP Client ────────────────────────────────────────────────────────
    "httpx==0.28.1",
    "requests==2.32.3",

    # ── AI / Embeddings ────────────────────────────────────────────────────
    "google-generativeai==0.8.3",
    "groq==0.13.0",
    "fastembed==0.4.2",

    # ── Observabilidade ────────────────────────────────────────────────────
    "sentry-sdk[fastapi]==2.19.2",

    # ── CLI ─────────────────────────────────────────────────────────────────
    "typer[all]==0.15.1",
    "rich==13.9.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",              # TestClient async
    "faker==33.1.0",
    "ruff==0.8.4",                # Linter + Formatter
    "mypy==1.13.0",
    "aiosqlite==0.20.0",          # SQLite async para testes (sem PostgreSQL)
    "pip-audit==2.7.3",           # Auditoria de vulnerabilidades
]

[project.scripts]
omni = "cli.admin:app"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "UP", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
